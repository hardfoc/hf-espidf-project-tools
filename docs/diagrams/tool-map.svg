<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#3730A3">TOOLS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#17202C">One configuration file, every script</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Apps, ESP-IDF versions, build types and target are written once, in app_config.yml.</text>

<text x="56" y="184.4" font-size="20" font-weight="700" fill="#115E59">app_config.yml</text>
<text x="56" y="215" font-size="17" fill="#2B3442">metadata (target, idf_versions, build_types), apps, build_config</text>
<text x="56" y="313.4" font-size="20" font-weight="700" fill="#3730A3">config_loader.sh</text>
<text x="56" y="344" font-size="17" fill="#2B3442">sourced by the shell scripts; yq or grep fallback</text>
<text x="636" y="313.4" font-size="20" font-weight="700" fill="#3730A3">generate_matrix.py, get_app_info.py</text>
<text x="636" y="344" font-size="17" fill="#2B3442">CI matrix; source file of an app</text>
<rect x="48" y="452.4" width="122.2" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="56" y="470.5" font-size="16" font-weight="700" fill="#3730A3">build_app.sh</text>
<rect x="178.2" y="452.4" width="122.3" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="186.2" y="470.5" font-size="16" font-weight="700" fill="#3730A3">flash_app.sh</text>
<rect x="308.4" y="452.4" width="138.4" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="316.4" y="470.5" font-size="16" font-weight="700" fill="#3730A3">manage_idf.sh</text>
<rect x="454.8" y="452.4" width="185.7" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="462.8" y="470.5" font-size="16" font-weight="700" fill="#3730A3">idf_flash_monitor.sh</text>
<text x="48" y="436.4" font-size="17" font-weight="700" fill="#3730A3">COMMANDS THAT READ IT</text>
<text x="56" y="571.4" font-size="20" font-weight="700" fill="#17202C">idf.py (ESP-IDF in ~/esp)</text>
<text x="56" y="602" font-size="17" fill="#2B3442">builds/build-app-&lt;app&gt;-type-&lt;build&gt;-target-&lt;t&gt;-idf-&lt;v&gt;</text>
<text x="636" y="571.4" font-size="20" font-weight="700" fill="#17202C">hf-espidf-ci-tools ru-build</text>
<text x="636" y="602" font-size="17" fill="#2B3442">generate_matrix.py, then build_app.sh per entry</text>

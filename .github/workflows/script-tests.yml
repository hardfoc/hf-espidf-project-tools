---
# Behaviour tests of the shell and Python scripts (tests/test_scripts.sh) with GNU tools (Ubuntu) and BSD tools
# and bash 3.2 (macOS). No ESP-IDF install; each job takes well under a minute.
name: 🧪 Script tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**.sh'
      - '**.py'
      - 'tests/**'
      - '.github/workflows/script-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: script-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Script tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Tool versions
        run: |
          /bin/bash --version | head -1
          stat --version 2>/dev/null | head -1 || echo "stat: BSD"
          find --version 2>/dev/null | head -1 || echo "find: BSD"

      - name: Run tests
        run: /bin/bash tests/test_scripts.sh

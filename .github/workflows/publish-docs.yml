---
name: 📚 Publish Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-with-doxygen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-docs:
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-docs-publish.yml@v1
    with:
      checkout_recursive: false
      # Jekyll configuration for this repo's docs
      jekyll_enabled: true
      jekyll_config: "docs/_config.yml"
      jekyll_source: "."
      jekyll_destination: "_site"
      jekyll_layouts_dir: "docs/_layouts"

      # Link checking
      run_link_check: true
      link_check_paths: "**/*.md"
      verbose: true

      # Markdown linting - false for now
      run_markdown_lint: false
      markdown_lint_paths: "**/*.md"

      # Spell checking
      run_spell_check: false
      spell_check_paths: "**/*.md"

      # Deploy to GitHub Pages (pushes to main / manual runs only, never from PRs)
      deploy_pages: ${{ github.event_name != 'pull_request' }}

  # ✅ Single required check: passes only if every job above passed
  ci-gate:
    name: CI gate
    needs: [publish-docs]
    if: always()
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-ci-gate.yml@v1
    permissions:
      contents: read
    with:
      needs_json: ${{ toJSON(needs) }}
